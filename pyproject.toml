[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scatter-tss"
version = "0.5.0"
description = "Single-cell TSS discovery and molecule quantification from tagged BAM files"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SCATTER contributors"}]
dependencies = [
    "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "anndata>=0.10,<0.13",
    "pysam>=0.22,<0.24", "PyYAML>=6,<7", "torch>=2.1,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
test = ["pytest>=7", "build>=1"]
analysis = ["scanpy>=1.9"]

[project.scripts]
scatter = "scatter.cli:main"

[project.urls]
Homepage = "https://github.com/syxu0912/SCATTER"
Repository = "https://github.com/syxu0912/SCATTER"
Issues = "https://github.com/syxu0912/SCATTER/issues"

[tool.setuptools]
packages = ["scatter"]
include-package-data = true

[tool.setuptools.package-data]
scatter = ["models/*.pth", "models/*.json", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

